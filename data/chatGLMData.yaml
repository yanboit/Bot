    \ {\n        Scanner scanner = new Scanner(System.in);\n        System.out.print(\"\
    请输入一个三位数：\");\n        int number = scanner.nextInt();\n\n        int hundreds\
    \ = number / 100;\n        int tens = (number / 10) % 10;\n        int units =\
