- content: ' JAVA水仙花数代码'
  role: user
- content: "当然可以！水仙花数是指一个 n 位数，它的每个位上的数字的 n 次幂之和等于它本身。例如，153 是一个三位数，因为 \\(1^3 + 5^3\
    \ + 3^3 = 153\\)。\n\n下面是一个简单的 Java 程序来查找并打印所有的水仙花数：\n\n```java\npublic class NarcissisticNumbers\
    \ {\n    public static void main(String[] args) {\n        for (int i = 100; i\
    \ < 1000; i++) { // 遍历三位数\n            int sum = 0;\n            int number =\
    \ i;\n            while (number != 0) {\n                int digit = number %\
    \ 10; // 获取最后一位数字\n                sum += Math.pow(digit, 3); // 计算每位数字的立方\n \
    \               number /= 10; // 去掉最后一位\n            }\n            if (sum ==\
    \ i) { // 如果立方和等于原数\n                System.out.println(i + \" 是水仙花数\");\n   \
    \         }\n        }\n    }\n}\n```\n\n这个程序将在范围 100 到 999 之间查找并打印所有的水仙花数。希望对你有帮助！\U0001F33C"
